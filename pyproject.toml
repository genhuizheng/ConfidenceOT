[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "confidenceot"
version = "0.5.0"
description = "ConfidenceOT: M4-E and M4-R confidence-filtered optimal transport with CPU and CUDA backends."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.20", "scipy>=1.9"]

[project.optional-dependencies]
benchmark = ["matplotlib>=3.8", "umap-learn>=0.5", "pot>=0.9"]
# POT supplies the comparator solvers -- balanced, unbalanced and
# partial OT -- rather than this repository's own implementations of
# them. A method comparison in which the competing methods are our
# code invites the reading that they were crippled, and no amount of
# care in writing them answers it; a reference implementation does.
# ConfidenceOT stays ours, because it is the thing under test.
# confidenceot.preprocessing needs PCA. The solver does not, so this is
# separate: fit(cost_matrix) still installs on numpy and scipy alone.
preprocessing = ["scikit-learn>=1.3"]
cuda = ["torch>=2.2"]
workflow = ["pandas>=2.0", "scikit-learn>=1.3", "matplotlib>=3.8"]
biology = ["pandas>=2.0", "scikit-learn>=1.3", "scanpy>=1.10,<2", "statsmodels>=0.14", "pydeseq2>=0.5,<0.6", "gseapy>=1.1", "lifelines>=0.30"]
ucell = ["pyucell>=0.7,<0.8"]

[project.scripts]
confidenceot-check = "confidenceot.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".codex_test_deps", "pytest-cache-files-*"]
