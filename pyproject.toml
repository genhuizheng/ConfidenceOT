[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "confidenceot"
version = "0.5.0"
description = "ConfidenceOT: M4-E and M4-R confidence-filtered optimal transport with CPU and CUDA backends."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.20", "scipy>=1.9"]

[project.optional-dependencies]
benchmark = ["matplotlib>=3.8", "umap-learn>=0.5"]
cuda = ["torch>=2.2"]
workflow = ["pandas>=2.0", "scikit-learn>=1.3", "matplotlib>=3.8"]
biology = ["pandas>=2.0", "scikit-learn>=1.3", "scanpy>=1.10,<2", "statsmodels>=0.14", "pydeseq2>=0.5,<0.6", "gseapy>=1.1"]

[project.scripts]
confidenceot-check = "confidenceot.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".codex_test_deps", "pytest-cache-files-*"]
